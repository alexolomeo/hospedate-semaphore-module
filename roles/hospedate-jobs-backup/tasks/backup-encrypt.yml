---

- name: "Backup Encrypt {{ hospedate_project|upper }} - {{ hospedate_environment|upper }} "
  block:

    - name: "Set variables from backup-encode"
      set_fact:
       my_date: "{{ hospedate_date }}"
       my_time: "{{ hospedate_time }}"

    - name: "{{ hospedate_project|upper }} {{ hospedate_environment|upper }} SERVER - PUSH PACKAGE - Checking hospedate_number_build from tranfer_push.yml"
      debug:
        msg: "hospedate_date is {{ my_date  }}, hospedate_time is : {{ my_time }}"

    - name: "Backup Encrypt {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Ensure app workdir exists: {{ hospedate_local_workdir }}"
      become: yes
      ansible.builtin.file:
        path: "{{ hospedate_local_workdir }}"
        state: directory
        owner: "{{ hospedate_user }}"
        group: "{{ hospedate_group_security }}"
        mode: 0775
        force: yes

    - name: "Backup Encrypt {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Backup directory workdir exists: {{ hospedate_local_workdir }}/encrypt"
      become_user: "{{ hospedate_user }}"
      ansible.builtin.file:
        path: "{{ hospedate_local_workdir }}/encrypt"
        state: directory
        owner: "{{ hospedate_user }}"
        group: "{{ hospedate_group_security }}"
        mode: 0775
        force: yes

    - name: "Backup Encrypt {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Backup directory workdir exists: {{ hospedate_local_workdir }}/encrypt/{{ my_date }}"
      become_user: "{{ hospedate_user }}"
      ansible.builtin.file:
        path: "{{ hospedate_local_workdir }}/encrypt/{{ my_date }}"
        state: directory
        owner: "{{ hospedate_user }}"
        group: "{{ hospedate_group_security }}"
        mode: 0775
        force: yes

    - name: "Backup Encrypt {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Log Directory workdir exists: {{ hospedate_local_workdir }}/log"
      become_user: "{{ hospedate_user }}"
      ansible.builtin.file:
        path: "{{ hospedate_local_workdir }}/log"
        state: directory
        owner: "{{ hospedate_user }}"
        group: "{{ hospedate_group_security }}"
        mode: 0775
        force: yes

    - name: "Backup Encrypt {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Bin Directory workdir exists: {{ hospedate_local_workdir }}/bin"
      become_user: "{{ hospedate_user }}"
      ansible.builtin.file:
        path: "{{ hospedate_local_workdir }}/bin"
        state: directory
        owner: "{{ hospedate_user }}"
        group: "{{ hospedate_group_security }}"
        mode: 0775
        force: yes

    - name: "Backup Encrypt {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Install - Copy the hospedate-encrypt script"
      become_user: "{{ hospedate_user }}"
      ansible.builtin.template:
        src: hospedate-encrypt.j2
        dest: "{{ hospedate_local_workdir }}/bin/hospedate-encrypt"
        owner: "{{ hospedate_user }}"
        group: "{{ hospedate_group_security }}"
        force: yes
        mode: 0775

    - name: "Backup Encrypt {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Copy the file from buffer-encrypt/{{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}.tar.gz"
      become_user: "{{ hospedate_user }}"
      ansible.builtin.copy:
        src: "buffer-encrypt/{{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}.tar.gz"
        dest: "{{ hospedate_local_workdir }}/encrypt/{{ my_date }}/{{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}.tar.gz"
        force: true

    - name: "Backup Encrypt {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Unarchive compress file {{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}.tar.gz"
      become_user: "{{ hospedate_user }}"
      ansible.builtin.unarchive:
        src: "{{ hospedate_local_workdir }}/encrypt/{{ my_date }}/{{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}.tar.gz"
        dest: "{{ hospedate_local_workdir }}/encrypt/{{ my_date }}/"
        remote_src: yes

    - name: "Backup Encrypt {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Delete compress {{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}.tar.gz"
      become_user: "{{ hospedate_user }}"
      ansible.builtin.file:
        path: "{{ hospedate_local_workdir }}/encrypt/{{ my_date }}/{{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}.tar.gz"
        state: absent
      ignore_errors: yes
  
    - name: "Backup Encrypt {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Start DUMP ENCRYPT for backup"
      become_user: "{{ hospedate_user }}"
      ansible.builtin.shell: "{{ hospedate_local_workdir }}/bin/hospedate-encrypt {{ hospedate_db_local_username }} {{ hospedate_db_local_password }} {{ hospedate_db_local_name }} {{ hospedate_db_local_host }} {{ hospedate_local_workdir }}/encrypt/{{ my_date }}/{{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}-{{ hospedate_flat }}.bkp {{ hospedate_local_workdir }}/encrypt/{{ my_date }}/{{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}.pub {{ hospedate_db_local_exclude }}"
      args:
        chdir: "{{ hospedate_local_workdir }}/encrypt/{{ my_date }}"
      ignore_errors: yes

    - name: "Backup Encrypt {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Finish backup put log {{ hospedate_local_workdir }}/log/backup-encrypt-{{ my_date }}.log "
      become_user: "{{ hospedate_user }}"
      ansible.builtin.command: >
        echo '{{ my_date }}{{ my_time }} [BACKUP ENCRYPT] Creating backup encrypt {{ hospedate_local_workdir }}/encrypt/{{ my_date }}/{{ hospedate_db_local_name }}-{{ my_date }}{{ my_time}}.bkp.bz2.enc from the database {{ hospedate_db_local_name }}' >> {{ hospedate_local_workdir }}/log/backup-encrypt-{{ my_date }}.log

    - name: "Backup Encrypt {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Delete {{ hospedate_local_workdir }}/encrypt/{{ my_date }}/{{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}.pub"
      become_user: "{{ hospedate_user }}"
      ansible.builtin.file:
        path: "{{ hospedate_local_workdir }}/encrypt/{{ my_date }}/{{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}.pub"
        state: absent
      ignore_errors: yes

#  when: ( inventory_hostname == 'com-integration') or ( inventory_hostname == 'com-production')

- block:

    - name: "Backup on {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Starting UPLOAD BUCKET  for backup encryp file"
      become_user: "{{ hospedate_user }}"
      ansible.builtin.shell: "mc cp  {{ hospedate_local_workdir }}/encrypt/{{ my_date }}/{{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}-{{ hospedate_flat }}.bkp.bz2.enc  {{ hospedate_bucket_target }}/{{ my_date }}/"
      args:
        chdir: "{{ hospedate_local_workdir }}/encrypt/{{ my_date }}/"

    - name: "Backup on {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Starting UPLOAD BUCKET  for encrypt key"
      become_user: "{{ hospedate_user }}"
      ansible.builtin.shell: "mc cp  {{ hospedate_local_workdir }}/encrypt/{{ my_date }}/{{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}.encrypt.pem  {{ hospedate_bucket_target }}/{{ my_date }}/"
      args:
        chdir: "{{ hospedate_local_workdir }}/encrypt/{{ my_date }}/"

    - name: "Backup on {{ hospedate_project|upper }} {{ hospedate_environment|upper }} - Share Public BUCKET  for Download"
      become_user: "{{ hospedate_user }}"
      ansible.builtin.shell: "mc share download {{ hospedate_bucket_target }}/{{ my_date }}/{{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}-{{ hospedate_flat }}.bkp.bz2.enc ; mc share download {{ hospedate_bucket_target }}/{{ my_date }}/{{ hospedate_db_local_name }}-{{ my_date }}-{{ my_time }}.encrypt.pem"
      register: hospedate_list_backup_read

    - name: BACKUP LIST PACKAGE - Print return information from the previous task
      ansible.builtin.debug:
        var: hospedate_list_backup_read.stdout_lines

  when: hospedate_bucket_activate == true and hospedate_bucket_provider == 'minio'
