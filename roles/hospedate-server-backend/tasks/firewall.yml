---

- block:
    - name: UFW - Allow HTTP connections
      community.general.ufw:
        rule: allow
        port: '80'

    - name: UFW - Brute-force attempt protection for HTTP
      community.general.ufw:
        rule: limit
        port: '80'
        proto: tcp

    - name: UFW - Allow HTTP Odoo connections
      community.general.ufw:
        rule: allow
        port: '8069'

    - name: UFW - Brute-force attempt protection for HTTP Odoo
      community.general.ufw:
        rule: limit
        port: '8069'
        proto: tcp

    - name: UFW - Allow SSH connections
      community.general.ufw:
        rule: allow
        port: '22'

    - name: UFW - Brute-force attempt protection for SSH
      community.general.ufw:
        rule: limit
        port: '22'
        proto: tcp

    - name: UFW - Deny other incoming traffic and enable UFW
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: UFW - Restart the SSH daemon
      ansible.builtin.systemd:
        state: restarted
        name: ssh


- name: FIREWALLD - Start Firewalld Service
  service:
    name: ufw
    enabled: yes
    state: started

