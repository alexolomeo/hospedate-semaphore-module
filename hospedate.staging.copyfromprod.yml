---

- name: hospedate staging copyfromprod
  hosts: semaphore_server 
  gather_facts: false
  strategy: free 
  vars:
    hospedate_group_security: hospedate
  roles:
    - role: hospedate-jobs-backup
      hospedate_mode: copyfromprod                   #backup, copyfromprod, restore, cleandb
      hospedate_project: hospedate                       # client
      hospedate_environment: staging             #integration, production
      hospedate_service: "{{ service_stop }}"
      hospedate_db_remote_profile: "{{ db_remote_profile }}"
      hospedate_db_remote_host: hospedate-prod-db.c7icsiso6en4.us-east-2.rds.amazonaws.com 
      hospedate_db_remote_name: hospedate
      hospedate_db_remote_port: 5432
      hospedate_db_remote_username: "{{ db_username_remote }}"
      hospedate_db_remote_password: "{{ db_password_remote }}"
      hospedate_db_local_host: hospedate-staging-db-new.c7icsiso6en4.us-east-2.rds.amazonaws.com
      hospedate_db_local_name: hospedate
      hospedate_db_local_port: 5432
      hospedate_db_local_username: "{{ db_username}}"
      hospedate_db_local_password: "{{ db_password }}"
      hospedate_db_local_username_main: "{{ db_username_main }}"
      hospedate_db_local_password_main: "{{ db_password_main }}"
      hospedate_db_restore_node: 10
      hospedate_db_local_retention: 1
      hospedate_db_remote_exclude: "{{ db_remote_exclude }}"        # --exclude-table-data 'audit.*' 
      hospedate_update_password_enable: disable
      hospedate_update_username: "{{ update_username }}"
      hospedate_update_password: "{{ update_password }}"
      hospedate_db_retention_day: 3                                # days
      hospedate_db_script: null

